# GitLab CI/CD Configuration for Conformance Predictions

stages:
  - test

test_modules:
  stage: test
  image: python:3.14.4
  script:
    - cd Code
    # Create a temporary virtual environment for the CI job
    - python3 -m venv .ci_venv
    - source .ci_venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest
    # Ensure 'src' is importable
    - export PYTHONPATH=$PYTHONPATH:$(pwd)
    - pytest tests/
